[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "twistor-vision"
version = "0.8.0"
description = "Sub-millisecond 3D robot localization, batched GPU Spinor RANSAC, and differentiable SU(2,2) conformal optics."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Ivan (isopidi-stack)" }
]
keywords = ["twistor", "robotics", "visual-odometry", "ransac", "computer-vision", "pytorch", "xpu", "cuda"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "torch>=2.1.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
demos = [
    "matplotlib>=3.7.0",
    "pillow>=10.0.0",
]
dev = [
    "pytest>=7.4.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/isopidi-stack/twistor-render-core"
Repository = "https://github.com/isopidi-stack/twistor-render-core"

[tool.setuptools.packages.find]
include = ["twistor*"]