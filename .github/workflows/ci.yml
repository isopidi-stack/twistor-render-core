name: Twistor-Render-Core 23-Test Mathematical Audit

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  mathematical-audit-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch numpy scipy --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Execute All 23 Mathematical & Algorithmic Unit Tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v